<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js"
      integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+"
      crossorigin="anonymous"
    ></script>
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand bg-dark">
      <div class="container">
        <a href="#" class="navbar-brand text-light">GBank</a>
      </div>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a href="#registration" class="nav-link text-light">Home</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link text-light">Enquiries</a>
        </li>
        <li class="nav-item">
          <a href="./register.html" class="nav-link active text-light">Registration</a>
        </li>
        <li class="nav-item">
          <a href="./login.html" class="nav-link active text-light">Login</a>
        </li>
      </ul>
    </nav>
    <div class="container mx-0 my-6" id="registration">
      <h1 class="justify-content-center" style="padding-bottom: 7px" >REGISTRATION</h1>
      <p style="padding-bottom: 7px;">
        Welcome user, to our registration page. Please fill in the form below to
        register.
      </p>
      <p style="padding-bottom: 7px;">
        We will send you a confirmation email once you have successfully
        registered.
      </p>
    </div>
    <div class="row justify-content-end my-6">
      <div class="col-lg-6">
        <form>
          <label for="email" class="form-label">Email address:</label>
          <input type="email" class="form-control" id="email" required />
          <div class="col-6" style="display: flex; flex-direction: row; gap: 6px; align-items: center;">
            <div class="col-12">
              <label for="name" class="form-label">First name:</label>
              <input type="text" class="form-control" id="name" required />
            </div>
            <div class="col-12">
              <label for="secondname" class="form-label">Second name:</label>
              <input
                type="text"
                class="form-control"
                id="secondname"
                required
              />
            </div>
          </div>
          <label for="number" class="form-label">Phone number:</label>
          <input type="number" class="form-control" id="number" required />
          <label for="password" class="form-label">Password:</label>
          <input type="password" class="form-control" id="password" required />
          <label for="message" class="form-label">Message:</label>
          <div>
            <label for="message" class="form-label"></label>
            <textarea class="form-control" id="message" rows="3" placeholder="Leave any text here"></textarea>
          </div> 
        </form>
        <button class="btn btn-primary mt-5">Submit</button>
      </div>
    </div>
  </body>
</html>
